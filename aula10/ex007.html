<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
    <style>
        body {
            font: normal 18pt Arial;
        }

        input {
            font: normal 18pt Arial;
            width: 100px;
        }

        div#res {
            margin-top: 20px;
        }

        input#m {
            width: 150px;
        }
    </style>
</head>
<body>
    <h1>Somando Valores</h1>
    <input type="number" name="txtn1" id="txtn1"> +
    <input type="number" name="txtn2" id="txtn2">
    <input type="button" value="Somar" onclick="somar()">
    <div id="res">Resultado</div>

    <h1>Multiplicando Valores</h1>
    <input type="number" name="mtn1" id="mtn1"> *
    <input type="number" name="mtn2" id="mtn2">
    <input type="button" value="Multiplicar" onclick="multiplicar()" id="m">
    <div id="resm">Resultado</div>

    <script>
        function somar() {
            var tn1 = window.document.getElementById('txtn1')
            var tn2 = window.document.querySelector('input#txtn2')

            var res = window.document.getElementById('res')

            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var s = n1 + n2

            res.innerHTML = `A soma entre ${n1} e ${n2} é igual a <strong>${s}</strong>`
        }

        function multiplicar() {
            var tn1 = window.document.getElementById('mtn1')
            var tn2 = window.document.querySelector('input#mtn2')

            var resm = window.document.getElementById('resm')

            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var m = n1 * n2

            resm.innerHTML = `Multiplicando ${n1} e ${n2} temos o valor <strong>${m}</strong>`

        }
    </script>
</body>
</html>
