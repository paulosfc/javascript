<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de países</title>
</head>
<body>
    <h1>Países</h1>
    Em que país você nasceu? <input type="text" name="txt1" id="txt1">
    <input type="button" value="Enviar" onclick="confirmar()">
    <div id="res"></div>

    <script>
        function confirmar() {
            var pa = window.document.getElementById('txt1')
            var res = window.document.querySelector('div#res')
            
            res.innerHTML = `<p>Vivendo em <strong>${pa}</strong></p>`

            if (pa == 'Brasil') {
                console.log('Você é Brasileiro')
            } else {
                console.log('Você é Estrangeiro!')
            }
        }
    </script>
</body>
</html>
